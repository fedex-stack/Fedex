<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin Dashboard</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 50% -10%,
            #24324d 0%,
            #111827 32%,
            #080b12 75%,
            #05070b 100%
        );

    padding-bottom: 40px;
}

button,
input,
select {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

button:active {
    transform: scale(.98);
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================================================
   TOP HEADER
========================================================= */

header {
    position: sticky;
    top: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 18px;

    padding: 16px 24px;

    /*
     * Removed heavy backdrop-filter.
     * Solid translucent background is much faster.
     */

    background: rgba(10,14,22,0.97);

    border-bottom:
        1px solid rgba(255,255,255,0.08);

    box-shadow:
        0 6px 20px rgba(0,0,0,0.20);
}

.header-brand {
    display: flex;
    align-items: center;

    gap: 13px;

    min-width: 0;
}

.brand-icon {
    width: 44px;
    height: 44px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 13px;

    background:
        linear-gradient(
            145deg,
            #ff7a18,
            #ff5a00
        );

    box-shadow:
        0 5px 14px rgba(255,102,0,0.20);

    font-size: 19px;
    font-weight: 800;
}

header h1 {
    font-size: 21px;

    font-weight: 750;

    letter-spacing: -0.5px;
}

.header-subtitle {
    margin-top: 3px;

    color:
        rgba(255,255,255,0.48);

    font-size: 12px;
}


/* =========================================================
   HEADER ACTIONS
========================================================= */

.actions {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

button {
    font-weight: 650;
}

#createBtn {
    padding: 12px 18px;

    border-radius: 13px;

    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #ff7a18,
            #ff5b00
        );

    box-shadow:
        0 5px 14px rgba(255,102,0,0.20);

    font-size: 14px;
}

#logoutBtn {
    padding: 12px 18px;

    border-radius: 13px;

    color:
        rgba(255,255,255,0.86);

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.10);

    font-size: 14px;
}

#logoutBtn:hover {
    background:
        rgba(255,255,255,0.10);
}


/* =========================================================
   MAIN CONTENT
========================================================= */

main {
    width: 100%;

    max-width: 1100px;

    margin: 0 auto;

    padding: 30px 20px 60px;
}


/* =========================================================
   DASHBOARD INTRO
========================================================= */

.dashboard-intro {
    margin-bottom: 22px;
}

.dashboard-intro h2 {
    font-size: 27px;

    font-weight: 750;

    letter-spacing: -0.8px;

    margin-bottom: 7px;
}

.dashboard-intro p {
    color:
        rgba(255,255,255,0.52);

    font-size: 14px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {
    position: relative;

    margin-bottom: 22px;
}

.search-box::before {
    content: "⌕";

    position: absolute;

    left: 17px;
    top: 50%;

    transform: translateY(-52%);

    color:
        rgba(255,255,255,0.45);

    font-size: 23px;

    z-index: 2;
}

.search-box input {
    width: 100%;

    padding: 16px 18px 16px 48px;

    border-radius: 16px;

    outline: none;

    border:
        1px solid rgba(255,255,255,0.10);

    color: #ffffff;

    /*
     * No blur here.
     */

    background:
        rgba(255,255,255,0.065);

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.05);

    font-size: 15px;
}

.search-box input::placeholder {
    color:
        rgba(255,255,255,0.38);
}

.search-box input:focus {
    border-color:
        rgba(10,132,255,0.55);

    box-shadow:
        0 0 0 3px rgba(10,132,255,0.09);
}


/* =========================================================
   SHIPMENT GRID
========================================================= */

#shipmentsContainer {
    display: grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap: 17px;
}


/* =========================================================
   SHIPMENT CARD
========================================================= */

.shipment-card {
    position: relative;

    overflow: hidden;

    padding: 21px;

    border-radius: 21px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.085),
            rgba(255,255,255,0.045)
        );

    border:
        1px solid rgba(255,255,255,0.10);

    /*
     * Heavy backdrop-filter removed.
     */

    box-shadow:
        0 10px 25px rgba(0,0,0,0.22),
        inset 0 1px 0 rgba(255,255,255,0.06);
}

.shipment-card:hover {
    border-color:
        rgba(255,255,255,0.16);
}


/*
 * Removed blurred pseudo-element glow.
 * It looked nice but was unnecessary GPU work.
 */

.shipment-card h3 {
    position: relative;

    margin-bottom: 13px;

    color: #ffffff;

    font-size: 18px;

    font-weight: 700;

    letter-spacing: -0.3px;
}

.shipment-card p {
    position: relative;

    color:
        rgba(255,255,255,0.62);

    margin-bottom: 9px;

    line-height: 1.45;

    font-size: 14px;
}


/* =========================================================
   CARD ACTIONS
========================================================= */

.card-actions {
    display: flex;

    gap: 9px;

    margin-top: 17px;

    padding-top: 15px;

    border-top:
        1px solid rgba(255,255,255,0.07);
}

.card-actions button {
    flex: 1;

    min-height: 43px;

    border-radius: 13px;

    font-size: 13px;
}

.edit-btn {
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #ff7817,
            #ff5b00
        );

    box-shadow:
        0 5px 14px rgba(255,102,0,0.16);
}

.copy-btn {
    color:
        rgba(255,255,255,0.85);

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.10);
}


/* =========================================================
   EMPTY STATE
========================================================= */

#emptyState {
    grid-column: 1 / -1;

    text-align: center;

    color:
        rgba(255,255,255,0.42);

    padding: 70px 20px;

    border-radius: 21px;

    background:
        rgba(255,255,255,0.035);

    border:
        1px solid rgba(255,255,255,0.07);
}


/* =========================================================
   EDIT MODAL
========================================================= */

#editModal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    padding: 20px;

    align-items: center;
    justify-content: center;

    background:
        rgba(0,0,0,0.78);
}


/* =========================================================
   MODAL
========================================================= */

.modal-content {
    position: relative;

    width: 100%;

    max-width: 460px;

    max-height:
        calc(100vh - 40px);

    overflow-y: auto;

    padding: 25px;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            #1e2636,
            #0c1018
        );

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 25px 60px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.07);
}


/*
 * Removed modal blurred blue glow.
 */

.modal-content h2 {
    position: relative;

    margin-bottom: 23px;

    font-size: 22px;

    font-weight: 750;

    letter-spacing: -0.5px;
}

.modal-content label {
    display: block;

    margin-bottom: 8px;

    color:
        rgba(255,255,255,0.62);

    font-size: 13px;

    font-weight: 600;
}

.modal-content input,
.modal-content select {
    width: 100%;

    padding: 14px 15px;

    margin-bottom: 18px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,0.10);

    outline: none;

    color: #ffffff;

    background:
        rgba(255,255,255,0.075);

    font-size: 15px;

    -webkit-appearance: none;
}

.modal-content select option {
    background: #171c27;

    color: #ffffff;
}

.modal-content input:focus,
.modal-content select:focus {
    border-color:
        rgba(10,132,255,0.55);

    box-shadow:
        0 0 0 3px rgba(10,132,255,0.10);
}


/* =========================================================
   MODAL BUTTONS
========================================================= */

.modal-buttons {
    display: flex;

    gap: 10px;

    margin-top: 4px;
}

.modal-buttons button {
    flex: 1;

    min-height: 47px;

    border-radius: 14px;

    font-size: 14px;
}

#saveUpdateBtn {
    color: #ffffff;

    background:
        linear-gradient(
            135deg,
            #ff7817,
            #ff5b00
        );

    box-shadow:
        0 6px 16px rgba(255,102,0,0.18);
}

#closeModalBtn {
    color:
        rgba(255,255,255,0.82);

    background:
        rgba(255,255,255,0.07);

    border:
        1px solid rgba(255,255,255,0.10);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px) {

    header {
        padding:
            15px 16px;

        align-items: flex-start;

        flex-direction: column;
    }

    .header-brand {
        width: 100%;
    }

    .brand-icon {
        width: 40px;
        height: 40px;

        border-radius: 12px;
    }

    header h1 {
        font-size: 18px;
    }

    .header-subtitle {
        font-size: 11px;
    }

    .actions {
        width: 100%;

        flex-direction: column;

        gap: 8px;
    }

    #createBtn,
    #logoutBtn {
        width: 100%;

        padding: 12px;
    }

    main {
        padding:
            24px 14px 50px;
    }

    .dashboard-intro h2 {
        font-size: 23px;
    }

    #shipmentsContainer {
        grid-template-columns: 1fr;

        gap: 13px;
    }

    .shipment-card {
        padding: 18px;

        border-radius: 19px;
    }

    .modal-content {
        padding: 21px;

        border-radius: 21px;
    }

}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:390px) {

    .card-actions {
        flex-direction: column;
    }

    .card-actions button {
        width: 100%;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="header-brand">

        <div class="brand-icon">
            FX
        </div>

        <div>

            <h1>
                Shipment Dashboard
            </h1>

            <div class="header-subtitle">
                Logistics Control Center
            </div>

        </div>

    </div>


    <div class="actions">

        <button id="createBtn">
            + Create Shipment
        </button>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================= -->

<main>

    <div class="dashboard-intro">

        <h2>
            Shipments
        </h2>

        <p>
            Manage, monitor and update active shipments.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            id="searchInput"
            type="search"
            autocomplete="off"
            placeholder="Search tracking code..."
        >

    </div>


    <!-- SHIPMENTS -->

    <div id="shipmentsContainer">

        <div id="emptyState">
            Loading shipments...
        </div>

    </div>

</main>



<!-- =======================================================
     EDIT MODAL
======================================================= -->

<div id="editModal">

    <div class="modal-content">

        <h2>
            Update Shipment
        </h2>


        <label for="editStatus">
            Shipment Status
        </label>

        <select id="editStatus">

            <option>
                Pending
            </option>

            <option>
                Picked Up
            </option>

            <option>
                Processing
            </option>

            <option>
                In Transit
            </option>

            <option>
                Out For Delivery
            </option>

            <option>
                Delivered
            </option>

            <option>
                Delayed
            </option>

            <option>
                Held
            </option>

            <option>
                Cancelled
            </option>

        </select>


        <label for="editLocation">
            Current Location
        </label>

        <input
            id="editLocation"
            type="text"
            placeholder="Enter current location"
            autocomplete="off"
        >


        <div class="modal-buttons">

            <button id="saveUpdateBtn">
                Save Update
            </button>

            <button id="closeModalBtn">
                Cancel
            </button>

        </div>

    </div>

</div>



<!-- =======================================================
     EXISTING ADMIN JAVASCRIPT
======================================================= -->

<script
    type="module"
    src="./js/admin.js"
></script>


</body>
</html>
