<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Shipment</title>

<style>
/* 1. Global Reset & iOS Typography */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
}

body {
    /* Ambient iOS Dark Mode Gradient Background */
    background: radial-gradient(circle at 50% 0%, #1c2438 0%, #0b0f17 100%);
    background-attachment: fixed;
    color: #ffffff;
    padding: 20px 14px 100px 14px;
    min-height: 100vh;
}

.container {
    max-width: 850px;
    margin: auto;
}

h1 {
    text-align: center;
    margin: 24px 0 28px 0;
    color: #ffffff;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.8px;
}

/* 2. Glassmorphic Card Container */
.card {
    background: rgba(255, 255, 255, 0.07);
    -webkit-backdrop-filter: blur(25px) saturate(180%);
    backdrop-filter: blur(25px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 22px;
    border-radius: 24px;
    margin-bottom: 20px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
}

.card h2 {
    margin-bottom: 16px;
    color: #ffffff;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
}

.card p {
    color: rgba(255, 255, 255, 0.75);
    margin-bottom: 12px;
    line-height: 1.5;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 10px;
}

.card p:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.card p strong {
    color: rgba(255, 255, 255, 0.5);
    font-weight: 500;
}

/* 3. Status Badges & Radar */
.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: #30D158; /* iOS System Green */
    background: rgba(48, 209, 88, 0.12);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.2px;
    border: 1px solid rgba(48, 209, 88, 0.25);
    margin-bottom: 16px;
}

.radar {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #30D158;
    position: relative;
}

.radar::after {
    content: "";
    position: absolute;
    inset: -6px;
    border: 2px solid #30D158;
    border-radius: 50%;
    animation: pulse 1.6s infinite ease-out;
}

@keyframes pulse {
    from {
        transform: scale(0.8);
        opacity: 1;
    }
    to {
        transform: scale(2.2);
        opacity: 0;
    }
}

.status-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
}

/* 4. Progress Bar */
.progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    position: relative;
    margin: 24px 0 20px 0;
    overflow: visible;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #0A84FF, #30D158);
    border-radius: 20px;
    transition: width 1s ease;
    box-shadow: 0 0 12px rgba(48, 209, 88, 0.4);
}

#truck {
    position: absolute;
    top: -18px;
    left: 0%;
    font-size: 24px;
    transition: left 1s ease;
    transform: scaleX(-1);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
}

/* 5. Mini Map Component */
#miniMap {
    height: 160px;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: 
        radial-gradient(circle at 50% 50%, rgba(10, 132, 255, 0.08), transparent 70%),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        #121721;
    background-size: 100% 100%, 28px 28px, 28px 28px;
    border: 1px solid rgba(255, 255, 255, 0.08);
}

.route-line {
    position: absolute;
    top: 50%;
    left: 12%;
    width: 75%;
    height: 3px;
    background: dashed linear-gradient(90deg, #0A84FF, #FF9F0A);
    border-top: 2px dashed rgba(255, 255, 255, 0.4);
}

.map-pin {
    position: absolute;
    top: 40%;
    right: 8%;
    font-size: 26px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

#mapTruck {
    position: absolute;
    top: 40%;
    left: 12%;
    font-size: 24px;
    transition: left 1s ease;
    transform: scaleX(-1);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
}

/* 6. Timeline Progress */
.timeline {
    position: relative;
    padding-left: 28px;
    margin-top: 10px;
}

.timeline::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 10px;
    bottom: 10px;
    width: 2px;
    background: rgba(255, 255, 255, 0.12);
}

.timeline-item {
    position: relative;
    margin-bottom: 16px;
    background: rgba(255, 255, 255, 0.04);
    padding: 16px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.06);
}

.timeline-item::before {
    content: "";
    position: absolute;
    left: -27px;
    top: 20px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #0A84FF;
    box-shadow: 0 0 10px #0A84FF;
}

.timeline-item h4 {
    margin-bottom: 4px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
}

/* 7. Loading & Error States */
#loading, #error {
    text-align: center;
    padding: 40px 0;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.6);
}

#error {
    color: #FF453A;
}

/* 8. Floating Support Dock */
.support-buttons {
    position: fixed;
    right: 20px;
    bottom: 24px;
    display: flex;
    gap: 10px;
    padding: 8px;
    border-radius: 35px;
    background: rgba(255, 255, 255, 0.1);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    z-index: 999;
}

.telegram-btn,
.email-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: white;
    font-size: 20px;
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.telegram-btn {
    background: #2AABEE;
}

.email-btn {
    background: #FF9F0A;
}

.telegram-btn:active,
.email-btn:active {
    transform: scale(0.9);
}

/* Mobile Adjustments */
@media(max-width: 600px) {
    h1 {
        font-size: 26px;
    }
    
    .card {
        padding: 18px;
        border-radius: 20px;
    }

    .status-title {
        font-size: 19px;
    }

    #miniMap {
        height: 130px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Track Shipment</h1>

    <div id="loading">Loading shipment...</div>
    <div id="error"></div>

    <div id="shipmentView" style="display:none;">

        <div class="card">
            <div class="live-badge">
                <div class="radar"></div>
                Live Tracking Active
            </div>

            <div class="status-title" id="status"></div>
            <p><strong>Estimated Delivery</strong> <span style="color: #ffffff; font-weight: 600;">⏳ Awaiting Confirmation</span></p>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
                <div id="truck">🚚</div>
            </div>
        </div>

        <div class="card">
            <h2>Live Route Map</h2>

            <div id="miniMap">
                <div class="route-line"></div>
                <div id="mapTruck">🚚</div>
                <div class="map-pin">📍</div>
            </div>
        </div>

        <div class="card">
            <h2>Shipment Details</h2>

            <p><strong>Tracking Code</strong> <span id="trackingCode"></span></p>
            <p><strong>Current Location</strong> <span id="location"></span></p>
            <p><strong>Destination</strong> <span id="destination"></span></p>
            <p><strong>Receiver</strong> <span id="receiver"></span></p>
            <p><strong>Sender</strong> <span id="sender"></span></p>
            <p><strong>Sender Contact</strong> <span id="senderPhone"></span></p>
            <p><strong>Receiver Contact</strong> <span id="receiverPhone"></span></p>
        </div>

        <div class="card">
            <h2>Shipment Progress</h2>
            <div id="timeline" class="timeline"></div>
        </div>

    </div>
</div>

<div class="support-buttons">
    <a href="https://t.me/fedexstack" target="_blank" class="telegram-btn" aria-label="Telegram Support">
       ✈️
    </a>
    <a href="mailto:fedexstacklogistics@gmail.com" class="email-btn" aria-label="Email Support">
       ✉️
    </a>
</div>

<script type="module" src="./js/track.js"></script>
</body>
</html>
